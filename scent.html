<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Fragrance | Yuan Music</title>
    <style>
        /* 莫兰迪色系定义 */
        :root {
            --morandi-bg: #EAE7E1;    
            --morandi-green: #A3B18A; 
            --morandi-dark: #3A4032;  
            --morandi-gold: #B8977E;  
            --white: #F8F9F7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Abadi MT Condensed Extra Bold', 'Abadi', 'Arial Nova Cond', sans-serif;
        }

        body {
            line-height: 1.7;
            color: var(--morandi-dark);
            background-color: var(--white);
            scroll-behavior: smooth;
            text-align: center; 
        }

        /* --- 修改点：移除了原先固定 header 的所有主页导航栏 CSS 样式 --- */

        /* --- 子页面专属：由于去掉了固定导航栏，大幅缩减 padding-top 顶开的空间 --- */
        .page-content-wrapper {
            padding-top: 60px;    /* 修改点：不再需要 220px，改为舒适自然的顶部间距 */
            padding-left: 10%;    /* 统一两侧的页面边距 */
            padding-right: 10%;
            padding-bottom: 60px;
            width: 100%;
        }

        /* --- 内容容器布局 --- */
        .quote-container {
            max-width: 800px;
            margin: 40px auto;    
            padding: 40px;
            border-left: 5px solid var(--morandi-green);
            background: rgba(234, 231, 225, 0.5);
            text-align: center;
        }

        .quote-en {
            font-size: 2.2rem;
            font-style: italic;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        .quote-cn {
            font-size: 1.4rem;
            color: var(--morandi-dark);
            opacity: 0.9;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .author {
            font-weight: bold;
            color: var(--morandi-gold);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .back-home {
            display: block;
            width: fit-content;
            margin: 50px auto 0;
            text-decoration: none;
            color: var(--morandi-green);
            font-size: 1.1rem;
            border: 1px solid var(--morandi-green);
            padding: 10px 25px;
            transition: all 0.3s;
        }

        .back-home:hover {
            background: var(--morandi-green);
            color: white;
        }

        /* 预留产品区域的占位符 */
        .coming-soon {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #999;
            letter-spacing: 2px;
        }

        /* --- 移动端/平板端自适应调整（Mobile Friendly 核心优化） --- */
        @media (max-width: 768px) {
            .page-content-wrapper {
                padding-top: 40px;   /* 手机端进一步微调收紧顶部 */
                padding-left: 5%;    /* 腾出更多横向空间给文字 */
                padding-right: 5%;
            }
            .quote-container {
                padding: 30px 20px;  /* 缩小内边距防挤压 */
                border-left: none;   
                border-top: 4px solid var(--morandi-green); /* 手机端左侧线条改到顶部更美观 */
            }
            .quote-en {
                font-size: 1.6rem;   /* 缩小手机端的英文字号，防止单词过长换行杂乱 */
            }
            .quote-cn {
                font-size: 1.1rem;   /* 适当缩小中文字号 */
            }
        }
    </style>
</head>
<body>

    <div class="page-content-wrapper">

        <div class="quote-container">
            <p class="quote-en">"The harmony of scent and sound transcends the reach of language."</p>
            <p class="quote-cn">“香氛与音乐的共鸣，远不止于辞藻之间。”</p>
            <p class="author">— Francis Kurkdjian</p>
        </div>

        <p class="coming-soon">EXQUISITE COLLECTION COMING SOON</p>

        <a href="index.html" class="back-home">Back to Home</a>

    </div>

</body>
</html>
